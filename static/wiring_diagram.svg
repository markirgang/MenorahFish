<svg id="wiringSvg" viewBox="0 0 1350 920" xmlns="http://www.w3.org/2000/svg" style="width: 100%; min-width: 1000px; height: auto; background: #060913; border-radius: 8px;">
    <defs>
        <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- GRID BACKGROUND -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#gridPattern)" />

    <!-- 1. POWER SUPPLY MODULE -->
    <g id="modPower">
        <rect x="40" y="30" width="280" height="130" rx="10" fill="#141c2e" stroke="#ff3344" stroke-width="2" />
        <rect x="40" y="30" width="280" height="30" rx="10" fill="#ff3344" opacity="0.2" />
        <text x="180" y="52" fill="#ff5566" font-weight="bold" font-size="14" text-anchor="middle">🔋 MAIN DUAL POWER SUPPLY</text>
        <rect x="60" y="80" width="110" height="35" rx="5" fill="#1f0f13" stroke="#ff3344" />
        <text x="115" y="102" fill="#ff8899" font-size="11" font-weight="bold" text-anchor="middle">+5V / +6V 12A (Servos)</text>
        <rect x="190" y="80" width="110" height="35" rx="5" fill="#0f1923" stroke="#00f0ff" />
        <text x="245" y="102" fill="#00f0ff" font-size="11" font-weight="bold" text-anchor="middle">+5V 3A (Raspberry Pi)</text>
        <rect x="125" y="125" width="110" height="25" rx="4" fill="#111" stroke="#aaaaaa" />
        <text x="180" y="142" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">⚡ COMMON GND BUS</text>
    </g>

    <!-- 2. RASPBERRY PI 40-PIN HEADER BLOCK -->
    <g id="modPi">
        <rect x="40" y="190" width="300" height="690" rx="12" fill="#0e1828" stroke="#00f0ff" stroke-width="2" />
        <rect x="40" y="190" width="300" height="36" rx="12" fill="#00f0ff" opacity="0.2" />
        <text x="190" y="214" fill="#00f0ff" font-weight="bold" font-size="15" text-anchor="middle">🍓 RASPBERRY PI 40-PIN GPIO HEADER</text>
        
        <rect x="55" y="240" width="125" height="26" rx="4" fill="#1a233a" stroke="#ffaa00" />
        <text x="117" y="257" fill="#ffaa00" font-size="10" font-weight="bold" text-anchor="middle">Pin 1: 3.3V Power</text>
        <rect x="195" y="240" width="130" height="26" rx="4" fill="#2a141a" stroke="#ff3344" />
        <text x="260" y="257" fill="#ff5566" font-size="10" font-weight="bold" text-anchor="middle">Pin 2: 5V Power</text>

        <rect x="55" y="272" width="125" height="26" rx="4" fill="#002b3d" stroke="#00f0ff" class="pin-box" data-pin="3" />
        <text x="117" y="289" fill="#00f0ff" font-size="10" font-weight="bold" text-anchor="middle">Pin 3: GPIO 2 (SDA1)</text>
        <rect x="195" y="272" width="130" height="26" rx="4" fill="#2a141a" stroke="#ff3344" />
        <text x="260" y="289" fill="#ff5566" font-size="10" font-weight="bold" text-anchor="middle">Pin 4: 5V Power</text>

        <rect x="55" y="304" width="125" height="26" rx="4" fill="#002b3d" stroke="#00f0ff" class="pin-box" data-pin="5" />
        <text x="117" y="321" fill="#00f0ff" font-size="10" font-weight="bold" text-anchor="middle">Pin 5: GPIO 3 (SCL1)</text>
        <rect x="195" y="304" width="130" height="26" rx="4" fill="#181818" stroke="#aaaaaa" class="pin-box" data-pin="6" />
        <text x="260" y="321" fill="#cccccc" font-size="10" font-weight="bold" text-anchor="middle">Pin 6: Ground (GND)</text>

        <rect x="55" y="336" width="125" height="26" rx="4" fill="#290022" stroke="#ff00cc" class="pin-box" data-pin="12" />
        <text x="117" y="353" fill="#ff00cc" font-size="10" font-weight="bold" text-anchor="middle">Pin 12: GPIO 18 (Mouth ENA)</text>
        <rect x="195" y="336" width="130" height="26" rx="4" fill="#181818" stroke="#aaaaaa" class="pin-box" data-pin="14" />
        <text x="260" y="353" fill="#cccccc" font-size="10" font-weight="bold" text-anchor="middle">Pin 14: Ground (GND)</text>

        <rect x="55" y="368" width="125" height="26" rx="4" fill="#001a33" stroke="#3399ff" class="pin-box" data-pin="16" />
        <text x="117" y="385" fill="#3399ff" font-size="10" font-weight="bold" text-anchor="middle">Pin 16: GPIO 23 (Mouth IN1)</text>
        <rect x="195" y="368" width="130" height="26" rx="4" fill="#001a33" stroke="#3399ff" class="pin-box" data-pin="18" />
        <text x="260" y="385" fill="#3399ff" font-size="10" font-weight="bold" text-anchor="middle">Pin 18: GPIO 24 (Mouth IN2)</text>

        <rect x="55" y="400" width="125" height="26" rx="4" fill="#002b20" stroke="#00ff88" class="pin-box" data-pin="22" />
        <text x="117" y="417" fill="#00ff88" font-size="10" font-weight="bold" text-anchor="middle">Pin 22: GPIO 25 (Body/Tail IN3)</text>
        <rect x="195" y="400" width="130" height="26" rx="4" fill="#002b20" stroke="#00ff88" class="pin-box" data-pin="24" />
        <text x="260" y="417" fill="#00ff88" font-size="10" font-weight="bold" text-anchor="middle">Pin 24: GPIO 8 (Body/Tail IN4)</text>

        <rect x="55" y="432" width="125" height="26" rx="4" fill="#290022" stroke="#ff00cc" class="pin-box" data-pin="35" />
        <text x="117" y="449" fill="#ff00cc" font-size="10" font-weight="bold" text-anchor="middle">Pin 35: GPIO 19 (Body/Tail ENB)</text>

        <rect x="55" y="605" width="270" height="40" rx="6" fill="#131c33" stroke="#2d3f6d" />
        <text x="190" y="622" fill="#8a99ad" font-size="10" font-weight="bold" text-anchor="middle">📹 CSI Camera Ribbon Connector</text>
        <text x="190" y="637" fill="#8a99ad" font-size="10" text-anchor="middle">Audio: 3.5mm Headphone Jack / USB Audio</text>
    </g>

    <!-- 3. PCA9685 16-CHANNEL PWM SERVO DRIVER -->
    <g id="modPca">
        <rect x="420" y="30" width="380" height="380" rx="12" fill="#0c1d2e" stroke="#00f0ff" stroke-width="2" />
        <rect x="420" y="30" width="380" height="34" rx="12" fill="#00f0ff" opacity="0.2" />
        <text x="610" y="53" fill="#00f0ff" font-weight="bold" font-size="14" text-anchor="middle">🎛️ PCA9685 16-CHANNEL 12-BIT PWM SERVO DRIVER (I2C: 0x40)</text>

        <rect x="440" y="75" width="340" height="35" rx="6" fill="#13243a" stroke="#00f0ff" />
        <text x="610" y="97" fill="#00f0ff" font-size="11" font-weight="bold" text-anchor="middle">VCC: 5V (Pi) | GND: Common | SDA: GPIO 2 | SCL: GPIO 3 | V+: Ext 5V/6V Power</text>

        <g font-size="10" font-weight="bold">
            <rect x="440" y="120" width="105" height="30" rx="4" fill="#291218" stroke="#ff3344" />
            <text x="492" y="139" fill="#ff6677" text-anchor="middle">Ch 0: Arm Base J1</text>

            <rect x="555" y="120" width="105" height="30" rx="4" fill="#291218" stroke="#ff3344" />
            <text x="607" y="139" fill="#ff6677" text-anchor="middle">Ch 1: Arm Shoulder J2</text>

            <rect x="670" y="120" width="110" height="30" rx="4" fill="#291218" stroke="#ff3344" />
            <text x="725" y="139" fill="#ff6677" text-anchor="middle">Ch 2: Arm Elbow J3</text>

            <rect x="440" y="160" width="105" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="492" y="179" fill="#ffd700" text-anchor="middle">Ch 3: Mouth Servo + Dreidel</text>

            <rect x="555" y="160" width="105" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="607" y="179" fill="#ffd700" text-anchor="middle">Ch 4: Tail Servo + Dreidel</text>

            <rect x="670" y="160" width="110" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="725" y="179" fill="#ffd700" text-anchor="middle">Ch 5: Arm Wrist/Claw J4/J5</text>

            <rect x="440" y="200" width="105" height="30" rx="4" fill="#002b3d" stroke="#00f0ff" />
            <text x="492" y="219" fill="#00f0ff" text-anchor="middle">Ch 6: Shamash Candle Bulb</text>

            <rect x="555" y="200" width="105" height="30" rx="4" fill="#002b3d" stroke="#00f0ff" />
            <text x="607" y="219" fill="#00f0ff" text-anchor="middle">Ch 7: Side Bulbs 1-4</text>

            <rect x="670" y="200" width="110" height="30" rx="4" fill="#002b3d" stroke="#00f0ff" />
            <text x="725" y="219" fill="#00f0ff" text-anchor="middle">Ch 8: Side Bulbs 5-8</text>

            <rect x="440" y="240" width="105" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="492" y="259" fill="#ffd700" text-anchor="middle">Ch 9: Fish Spot Pan</text>

            <rect x="555" y="240" width="105" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="607" y="259" fill="#ffd700" text-anchor="middle">Ch 10: Fish Spot Tilt</text>

            <rect x="670" y="240" width="110" height="30" rx="4" fill="#292000" stroke="#ffd700" />
            <text x="725" y="259" fill="#ffd700" text-anchor="middle">Ch 11: 4 Light Domes</text>
        </g>
    </g>

    <!-- 4. L298N CONTROLLER -->
    <g id="modL298">
        <rect x="420" y="430" width="380" height="210" rx="12" fill="#1f0f18" stroke="#ff00cc" stroke-width="2" />
        <rect x="420" y="430" width="380" height="32" rx="12" fill="#ff00cc" opacity="0.2" />
        <text x="610" y="452" fill="#ff00cc" font-weight="bold" font-size="14" text-anchor="middle">⚙️ L298N DUAL H-BRIDGE MOTOR DRIVER</text>

        <g font-size="10" font-weight="bold">
            <rect x="440" y="475" width="105" height="28" rx="4" fill="#290022" stroke="#ff00cc" />
            <text x="492" y="493" fill="#ff00cc" text-anchor="middle">ENA: GPIO 18 (Pin 12)</text>

            <rect x="555" y="475" width="105" height="28" rx="4" fill="#131c33" stroke="#3399ff" />
            <text x="607" y="493" fill="#3399ff" text-anchor="middle">IN1: GPIO 23 (Pin 16)</text>

            <rect x="670" y="475" width="110" height="28" rx="4" fill="#131c33" stroke="#3399ff" />
            <text x="725" y="493" fill="#3399ff" text-anchor="middle">IN2: GPIO 24 (Pin 18)</text>

            <rect x="440" y="515" width="105" height="28" rx="4" fill="#290022" stroke="#ff00cc" />
            <text x="492" y="533" fill="#ff00cc" text-anchor="middle">ENB: GPIO 19 (Pin 35)</text>

            <rect x="555" y="515" width="105" height="28" rx="4" fill="#002b20" stroke="#00ff88" />
            <text x="607" y="533" fill="#00ff88" text-anchor="middle">IN3: GPIO 25 (Pin 22)</text>

            <rect x="670" y="515" width="110" height="28" rx="4" fill="#002b20" stroke="#00ff88" />
            <text x="725" y="533" fill="#00ff88" text-anchor="middle">IN4: GPIO 8 (Pin 24)</text>

            <rect x="440" y="555" width="160" height="35" rx="5" fill="#2b141a" stroke="#ff3344" />
            <text x="520" y="572" fill="#ff6677" text-anchor="middle">OUT1 / OUT2 (Channel A):</text>
            <text x="520" y="584" fill="#ffffff" font-size="9" text-anchor="middle">Fish Mouth DC Motor (Lipsync)</text>

            <rect x="620" y="555" width="160" height="35" rx="5" fill="#2b0020" stroke="#ff00cc" />
            <text x="700" y="572" fill="#ff66cc" text-anchor="middle">OUT3 / OUT4 (Channel B):</text>
            <text x="700" y="584" fill="#ffffff" font-size="9" text-anchor="middle">Fwd 3s Body Swing / Rev Tail Wag</text>
        </g>
    </g>

    <!-- 5. STAGE HARDWARE OUTPUTS -->
    <g id="modStage">
        <rect x="840" y="30" width="470" height="610" rx="12" fill="#121729" stroke="#00ff88" stroke-width="2" />
        <rect x="840" y="30" width="470" height="34" rx="12" fill="#00ff88" opacity="0.2" />
        <text x="1075" y="293" fill="#00ff88" font-weight="bold" font-size="14" text-anchor="middle">🎭 MENORAH FISH & ROBOT ARM STAGE ENDPOINTS</text>

        <rect x="860" y="320" width="210" height="120" rx="8" fill="#291218" stroke="#ff3344" />
        <text x="965" y="342" fill="#ff6677" font-weight="bold" font-size="12" text-anchor="middle">🐟 GEMMY SINGING TROUT</text>
        <text x="965" y="362" fill="#dddddd" font-size="10" text-anchor="middle">• Mouth DC Motor: L298 Ch A</text>
        <text x="965" y="380" fill="#dddddd" font-size="10" text-anchor="middle">• Body 3s PWM Ramp: L298 Ch B Fwd</text>
        <text x="965" y="398" fill="#dddddd" font-size="10" text-anchor="middle">• Tail Wag Motor: L298 Ch B Rev</text>
        <text x="965" y="416" fill="#dddddd" font-size="10" text-anchor="middle">• Head Spotlight: PCA Ch 9, 10</text>

        <rect x="1090" y="320" width="200" height="120" rx="8" fill="#002b3d" stroke="#00f0ff" />
        <text x="1190" y="342" fill="#00f0ff" font-weight="bold" font-size="12" text-anchor="middle">🦾 5-DOF ROBOT ARM</text>
        <text x="1190" y="362" fill="#dddddd" font-size="10" text-anchor="middle">• Arm Servos: PCA Ch 0 - 5</text>
        <text x="1190" y="380" fill="#dddddd" font-size="10" text-anchor="middle">• Claw Flickering Candle: ALWAYS ON</text>
        <text x="1190" y="398" fill="#dddddd" font-size="10" text-anchor="middle">• Menorah Candle Lighting Arc</text>

        <rect x="860" y="455" width="430" height="130" rx="8" fill="#211d00" stroke="#ffd700" />
        <text x="1075" y="477" fill="#ffd700" font-weight="bold" font-size="12" text-anchor="middle">🕎 180° MENORAH ARC & 4 LIGHT DOMES</text>
        <text x="1075" y="497" fill="#dddddd" font-size="10" text-anchor="middle">• 9 Menorah Candle Light Bulbs (PCA Ch 6, 7, 8)</text>
        <text x="1075" y="515" fill="#dddddd" font-size="10" text-anchor="middle">• 4 Stage Light Domes Breathing Sequence (PCA Ch 11)</text>
        <text x="1075" y="533" fill="#dddddd" font-size="10" text-anchor="middle">• Spinning Dreidels on Servos (PCA Ch 3, 4)</text>
    </g>

    <!-- WIRE PATHS -->
    <g id="wireGroup" stroke-width="2.5" fill="none" opacity="0.85">
        <path class="wire wire-power" data-category="power" d="M 260 240 L 260 170 L 245 170 L 245 115" stroke="#ff3344" stroke-dasharray="4,2" />
        <path class="wire wire-power" data-category="power" d="M 260 304 L 260 180 L 180 180 L 180 150" stroke="#aaaaaa" />

        <path class="wire wire-i2c" data-category="i2c" d="M 180 272 L 390 272 L 390 92 L 440 92" stroke="#00f0ff" stroke-width="3" />
        <path class="wire wire-i2c" data-category="i2c" d="M 180 304 L 380 304 L 380 84 L 440 84" stroke="#3399ff" stroke-width="3" />

        <path class="wire wire-l298" data-category="l298" d="M 180 336 L 400 336 L 400 489 L 440 489" stroke="#ff00cc" stroke-width="2.5" />
        <path class="wire wire-l298" data-category="l298" d="M 325 368 L 390 368 L 390 489 L 555 489" stroke="#3399ff" stroke-width="2.5" />
        <path class="wire wire-l298" data-category="l298" d="M 325 385 L 380 385 L 380 489 L 670 489" stroke="#3399ff" stroke-width="2.5" />

        <path class="wire wire-servos" data-category="servos" d="M 800 135 L 830 135 L 830 380 L 860 380" stroke="#ff3344" stroke-width="3" />
        <path class="wire wire-servos" data-category="servos" d="M 800 215 L 820 215 L 820 380 L 1090 380" stroke="#00f0ff" stroke-width="3" />
    </g>
</svg>